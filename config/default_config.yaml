# Default configuration for Poker Hand Analyzer

# Card positions (for reference resolution 1456x819)
reference_resolution:
  width: 1456
  height: 819

card_positions:
  board:
    - [260, 80, 130, 250]    # 6♦ (first card)
    - [400, 80, 130, 250]    # 4♠ 
    - [540, 80, 130, 250]    # 8♣
    - [680, 80, 130, 250]    # 10♠
    - [820, 80, 130, 250]    # 5♥
  
  left_hand:
    - [260, 425, 60, 240]   # A♥
    - [330, 425, 110, 240]   # 3♥
  
  right_hand:
    - [760, 425, 60, 240]   # 9♥
    - [820, 425, 110, 240]   # K♦

# Card recognition settings
recognition:
  corner_crop_ratio: 0.45  # Crop top-left corner for rank/suit detection
  ocr_whitelist: "A23456789JQK10"
  min_confidence: 0.7
  
  # Color thresholds for suit detection
  red_threshold:
    min_r: 130
    r_over_b: 25
    r_over_g: 15
  
  black_threshold:
    max_r: 140
    max_g: 140
    max_b: 140

# Analysis settings
analysis:
  loop_interval: 2.0  # seconds between analyses
  retry_on_failure: true
  max_retries: 3

# Logging
logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "poker_analyzer.log"
  console: true
